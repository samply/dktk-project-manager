<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:pm="https://github.com/samply/project-manager">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>New Project Notification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<p>Dear <email-to-name default="Project Applicant" />,</p>
<br>
<p>We are pleased to inform you that your new project has been successfully created.</p>

<p>Project Details:</p>
<ul style="list-style-type: none; padding-left: 0;">
    <li><strong>Project ID:</strong> <project-code/></li>
    <li><strong>Created By:</strong> <project-creator-name/> (<project-creator-email/>)</li>
    <li><strong>Type:</strong> <project-type/></li>
    <li><strong>Label:</strong> <query-label/></li>
    <li><strong>Description:</strong> <query-description/></li>
    <li><strong>Bridgeheads:</strong> <project-bridgeheads/></li>
</ul>

<p>You can view the project by clicking on the following link:</p>
<p><project-view-link/></p>

<support-info/>
<team-signature/>

</body>
</html>
