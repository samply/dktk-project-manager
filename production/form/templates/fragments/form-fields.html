<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Form fields fragment</title>
    <meta charset="UTF-8"/>
</head>
<body>

<!--
    Reusable form-field rendering fragment, shared by every deployment's
    form-PDF template via th:replace, e.g.:
      <table th:replace="~{fragments/form-fields :: fieldsTable(document=${document})}"></table>

    The structure (which headings and rows appear, and in which order) is
    built in Java (FormTemplateDocumentBuilder) and passed as "document": an
    ordered list of nodes, each with a "kind":
      - "section": heading of a printed form; rows before the first section
                   heading are the header block (the request's basic data);
      - "group": heading of a field group, with its nesting "level" (1, 2, ...);
      - "block": heading of a block instance, e.g. "Collaborator 2";
      - "row":   one field, or ("layout") the fields of a configured layout
                 row side by side, with their "widths"; "fullWidth" for a
                 field without display name and description;
      - "checkboxes": a CHECK_BOX field with all its options.
    Descriptions are already resolved (full, else short).
    This fragment only renders those nodes.

    This fragment relies on the caller's Thymeleaf context also exposing the
    "DataType" enum class (added by FormTemplateService), used below to
    switch on a field's type.

    Texts with HTML. Configured texts may contain HTML (a link, <strong>, a
    list), which the frontend shows with v-html. The same texts are shown as
    HTML here, through the "html" helper of the context (FormTemplateHtml):
      - th:utext="${html.xhtml(text)}": the text with its HTML. Never put a
        text into th:utext without html.xhtml: the page is read as strict XML
        when it becomes a PDF, and a "<br>", "&nbsp;" or bare "&" in the text
        would make the whole PDF fail.
      - th:text="${html.text(text)}": the text without its HTML, for the
        value of a form widget (a textarea cannot show a link).
    Shown as HTML, as in the frontend: a field's display name and
    description, an allowed value's display name and description, a block's
    description. Shown as plain text, as in the frontend: the headings of
    sections, groups and blocks, the descriptions of sections and groups, and
    every value a user entered.
-->
<table th:fragment="fieldsTable(document)" class="form-table">
    <!--
        Column widths stated here, not only on the cells: with table-layout
        fixed they would otherwise come from the first row, which may be a
        full-width section heading.
    -->
    <colgroup>
        <col class="label-column"/>
        <col class="value-column"/>
    </colgroup>
    <tbody>
    <th:block th:each="node : ${document.nodes}">

        <tr th:if="${node.kind == 'section'}" class="section-header-row">
            <td class="section-title-cell" colspan="2">
                <div class="section-name"
                     th:text="${node.form.titleDisplayName != null ? node.form.titleDisplayName : node.form.title}">
                    Section Display Name
                </div>
                <div class="description" th:if="${node.description != null}"
                     th:text="${node.description}">Section Description
                </div>
            </td>
        </tr>

        <!--
            Group and block headings span both columns, so each deployment's
            CSS decides their alignment (e.g. left in master, centred in cce).
        -->
        <tr th:if="${node.kind == 'group'}" class="group-header-row"
            th:classappend="${'group-level-' + node.level}">
            <td class="group-title-cell" colspan="2">
                <div class="group-name" th:text="${node.group.displayName}">Group Display Name</div>
                <div class="description" th:if="${node.description != null}"
                     th:text="${node.description}">Group Description
                </div>
            </td>
        </tr>

        <tr th:if="${node.kind == 'block'}" class="group-header-row block-header-row">
            <td class="group-title-cell" colspan="2">
                <div class="group-name" th:text="${node.title}">Block Display Name</div>
                <div class="description" th:if="${node.description != null}"
                     th:utext="${html.xhtml(node.description)}">Block Description
                </div>
            </td>
        </tr>

        <tr th:if="${node.kind == 'row' && !node.layout && !node.fullWidth}" class="field-row">
            <td th:replace="~{::fieldLabel(field=${node.fields[0].field})}"></td>
            <td th:replace="~{::fieldValue(field=${node.fields[0].field}, key=${node.fields[0].key})}"></td>
        </tr>

        <!-- A field without display name and description: its value takes the whole row. -->
        <tr th:if="${node.kind == 'row' && !node.layout && node.fullWidth}" class="field-row full-width-row">
            <td class="value-cell full-width-cell" colspan="2">
                <th:block th:replace="~{::fieldValueContent(field=${node.fields[0].field}, key=${node.fields[0].key})}"></th:block>
            </td>
        </tr>

        <!--
            A CHECK_BOX field: every allowed value with its own (fillable)
            checkbox, checked if selected, so an unchecked option stays visible.
        -->
        <tr th:if="${node.kind == 'checkboxes'}" class="field-row checkbox-list-row">
            <!-- th:replace runs before th:unless on one tag, so the condition wraps it. -->
            <th:block th:unless="${node.fullWidth}">
                <td th:replace="~{::fieldLabel(field=${node.field.field})}"></td>
            </th:block>
            <td class="value-cell" th:classappend="${node.fullWidth ? 'full-width-cell' : ''}"
                th:colspan="${node.fullWidth ? 2 : 1}">
                <div class="checkbox-option" th:each="option : ${node.options}">
                    <input type="checkbox" th:name="${option.name}" th:checked="${option.checked}"/>
                    <div class="checkbox-option-text">
                        <div class="checkbox-option-name" th:utext="${html.xhtml(option.displayName)}">Option</div>
                        <div class="description" th:if="${option.description != null}"
                             th:utext="${html.xhtml(option.description)}">Option description</div>
                    </div>
                </div>
            </td>
        </tr>

        <!--
            Layout row: every field of the row side by side, in the same
            2-column label-cell/value-cell table structure (each cell holding
            one entry per field), so the table keeps a uniform 2-column layout
            the PDF renderer can size reliably.
        -->
        <tr th:if="${node.kind == 'row' && node.layout}" class="field-row layout-row">
            <td class="label-cell">
                <th:block th:each="rowField, stat : ${node.fields}">
                    <div class="layout-field-label-wrapper"
                         th:classappend="${rowField.field.labelDisplayName != null && !#strings.isEmpty(#strings.trim(rowField.field.labelDisplayName)) && (rowField.field.type == DataType.STRING || rowField.field.type == DataType.LONG_STRING || rowField.field.type == DataType.ENUM) ? 'textarea-value-label' : ''}"
                         th:style="|width: ${node.widths[stat.index]}%;|">
                        <th:block th:replace="~{::fieldLabelContent(field=${rowField.field})}"></th:block>
                    </div>
                </th:block>
            </td>
            <td class="value-cell">
                <th:block th:each="rowField, stat : ${node.fields}">
                    <div class="layout-field-value-wrapper"
                         th:style="|width: ${node.widths[stat.index]}%;|">
                        <th:block th:replace="~{::fieldValueContent(field=${rowField.field}, key=${rowField.key})}"></th:block>
                    </div>
                </th:block>
            </td>
        </tr>
    </th:block>
    </tbody>
</table>

<!-- Label-cell content for one field: display name + description. Shared by the plain and layout-row rendering. -->
<td th:fragment="fieldLabel(field)" class="label-cell"
    th:classappend="${field.labelDisplayName != null && !#strings.isEmpty(#strings.trim(field.labelDisplayName)) && (field.type == DataType.STRING || field.type == DataType.LONG_STRING || field.type == DataType.ENUM) ? 'textarea-value-label' : ''}">
    <th:block th:replace="~{::fieldLabelContent(field=${field})}"></th:block>
</td>
<th:block th:fragment="fieldLabelContent(field)"
          th:with="hasDisplayName=${field.labelDisplayName != null && !#strings.isEmpty(#strings.trim(field.labelDisplayName))}">
    <!--
        F7/§5.3: a multiple (non-block) field's instances are distinguished by
        a numbered label suffix, e.g. "Comments (2)", rather than repeating the
        same label with no indication of which instance it is.
    -->
    <div th:if="${hasDisplayName}"
         th:classappend="|${field.mandatory ? 'mandatory' : ''} ${ (field.groups != null && field.groups.length > 0) ? 'grouped-label' : '' }|"
         class="display-name"
         th:utext="${(field.multiple != null && field.multiple && field.fieldInstance != null) ? html.xhtml(field.labelDisplayName) + ' (' + field.fieldInstance + ')' : html.xhtml(field.labelDisplayName)}">
        Label
    </div>
    <div class="description"
         th:classappend="${!hasDisplayName && field.mandatory ? 'mandatory' : ''}"
         th:utext="${html.xhtml(field.fetchFullLabelDescription)}">
        Description
    </div>
</th:block>

<!-- Value-cell content for one field: the DataType switch. Shared by the plain and layout-row rendering. -->
<td th:fragment="fieldValue(field, key)" class="value-cell">
    <th:block th:replace="~{::fieldValueContent(field=${field}, key=${key})}"></th:block>
</td>
<!--
    Value rendering keeps real, editable <textarea>/<input> AcroForm widgets
    (the PDF is meant to stay fillable even for fields that already have a
    value - 2026-09-09 feedback point 2), so a viewer can still type into
    them. The overlap bug (2026-09-09 feedback point 1) was never about
    editability - it was that these widgets were sized via a
    "height: 100%" (child) + "height: 1px" (.value-cell parent) hack that
    openhtmltopdf could not turn into a real widget rectangle (it logged
    "no rectangle, no appearance stream created" for every one), so a value
    wrapping onto a second line painted straight through into the row below.
    The fix here sizes a <textarea> the native way instead: an explicit
    "rows" attribute, estimated from the value's length and line count
    (fetchEstimatedRows below), which openhtmltopdf can turn into a normal,
    well-defined box - independent of any parent's height - the same way a
    plain unstyled <textarea rows="n"> sizes in any renderer. The estimate
    intentionally errs toward more rows (extra blank space) rather than too
    few (overlap again).
-->
<th:block th:fragment="fieldValueContent(field, key)">
    <div th:switch="${field.type}">
        <!--
            th:case and th:replace must NOT be combined on the same tag here:
            doing so broke th:switch's exclusivity (STRING, LONG_STRING, and
            the "*" default all rendered at once) - wrapping th:case on its
            own th:block, with th:replace on a separate nested tag (as the
            ENUM case below already did), is what makes it exclusive again.
        -->
        <!--
            A shorter minRows (1-2) was tried here for STRING/ENUM, since many
            of those fields hold short values and a tall box reads as dead
            space in this lighter design. Reverted: openhtmltopdf's PDF
            appearance generator auto-shrinks the font to an illegible size
            whenever the widget's rows count is below ~3, regardless of the
            CSS min-height - confirmed by rendering and visually inspecting
            both rows=1 and rows=2. A few extra pixels of blank space is a
            much smaller problem than unreadable text, so every text case
            below shares the same safe minRows=3.
        -->
        <th:block th:case="${DataType.STRING}">
            <textarea th:replace="~{::textareaValue(value=${field.value}, key=${key}, minRows=${3})}"></textarea>
        </th:block>
        <th:block th:case="${DataType.LONG_STRING}">
            <textarea th:replace="~{::textareaValue(value=${field.value}, key=${key}, minRows=${3})}"></textarea>
        </th:block>
        <!--
            F8/§5: an ENUM field's selected allowed value can carry its own
            description, distinct from the field's labelDescription, so it is
            shown alongside the plain display name rather than dropped.
            The display name goes into a textarea, which cannot show HTML:
            html.text leaves only its text.
        -->
        <th:block th:case="${DataType.ENUM}">
            <textarea th:replace="~{::textareaValue(value=${html.text(field.fetchDisplayValue)}, key=${key}, minRows=${3})}"></textarea>
            <div class="description" th:if="${field.fetchDisplayDescription != null}"
                 th:utext="${html.xhtml(field.fetchDisplayDescription)}">Value description</div>
        </th:block>
        <input th:case="${DataType.INTEGER}" type="text" class="pdf-input-single"
               th:name="${key}" th:value="${field.fetchDisplayValue}"/>
        <input th:case="${DataType.DOUBLE}" type="text" class="pdf-input-single"
               th:name="${key}" th:value="${field.fetchDisplayValue}"/>
        <span th:case="${DataType.DATE}" class="pdf-input"
              th:text="${field.fetchDisplayValue}"></span>
        <span th:case="${DataType.TIMESTAMP}" class="pdf-input"
              th:text="${field.fetchDisplayValue}"></span>
        <span th:case="${DataType.LOCAL_DATE_TIME}" class="pdf-input"
              th:text="${field.fetchDisplayValue}"></span>
        <div th:case="${DataType.BOOLEAN}" class="pdf-checkbox-wrapper">
            <input type="checkbox" th:name="${key}"
                   th:checked="${field.value == 'true'}"/>
        </div>
        <span th:case="*" class="pdf-input" th:text="${field.value}"></span>
    </div>
</th:block>

<!--
    A single editable <textarea>, sized via a "rows" attribute estimated from
    the value's length and line count instead of any percentage-height trick,
    so openhtmltopdf can compute a real, well-defined widget rectangle (see
    the comment above fieldValueContent for why that matters). The estimate
    (~50 characters/row, plus one row per embedded newline, plus one row of
    margin) deliberately errs toward more rows rather than too few. minRows
    lets a short-value type (e.g. STRING) stay compact instead of always
    reserving a LONG_STRING-sized block of empty space.
-->
<textarea th:fragment="textareaValue(value, key, minRows)" class="pdf-input" th:name="${key}"
          th:with="lineCount=${value == null ? 1 : value.split('\n', -1).length},
                   charCount=${value == null ? 0 : value.length()},
                   estimatedRows=${lineCount + (charCount / 50) + 1},
                   rows=${estimatedRows < minRows ? minRows : estimatedRows}"
          th:style="|height: ${(rows * 14) + 20}pt;|"
          th:text="${value}"></textarea>

</body>
</html>
