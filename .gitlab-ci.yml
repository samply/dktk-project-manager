stages:
  - docker
build-docker:
  stage: docker
  variables:
    IMGNAME: ccp/master-project-manager
  # Default branch leaves tag empty (= latest tag)
  # All other branches are tagged with the escaped branch name (commit ref slug)
  before_script:
    - docker login -u "$DOCKER_VERBIS_USER" -p "$DOCKER_VERBIS_PASSWORD" https://$DOCKER_VERBIS_REGISTRY
  script:
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        tag=""
        echo "Running on default branch '$CI_DEFAULT_BRANCH': tag = 'latest'"
      else
        tag=":$CI_COMMIT_REF_SLUG"
        echo "Running on branch '$CI_COMMIT_BRANCH': tag = $tag"
      fi
    - IMGNAME=$DOCKER_VERBIS_REGISTRY/${IMGNAME}${tag}
    - docker build --pull -t "$IMGNAME" .
    - docker push "$IMGNAME"
    # The CI/CD secrets are only available in protected branches, so a branch
    # has to be protected before it can be built and pushed. With the tag above
    # it publishes under its own slug, leaving the default branch's untagged
    # (latest) image alone.
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
